# .github/workflows/ci.yml

name: CI

on:
  # Run on push or PRs to main branch. `publish.yml` starts from this workflow's own completed run
  # on `master` (`workflow_run`), so a push runs these checks once and publish waits for them.
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Allows reading of the repository's contents.

    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672 # AMQP port
          - 15672:15672 # dashboard management
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Check for circular-import hazards
        run: deno run --no-config -A jsr:@zanix/cli check-cycles

      - name: Check for duplicate '@zanix/*' dependencies
        run: deno run --no-config -A jsr:@zanix/cli check-duplicates

      - name: Wait for RabbitMQ
        run: |
          echo "Waiting RabbitMQ..."
          for i in {1..10}; do
            if nc -z localhost 5672; then
              echo "RabbitMQ is ready"
              break
            fi
            echo "RabbitMQ not ready..."
            sleep 3
          done

      - name: Run tests
        run: deno test --allow-all
